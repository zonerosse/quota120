<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex">
<title>Pannello Admin · Quota 120</title>
<link rel="icon" href="/favicon.svg">
<link rel="stylesheet" href="/fonts/barlow.css">
<style>
:root{--pagina:#E8EDF0;--notte:#132A3A;--bordo:#D3DBE0;--ink:#0F1C26;--ink3:#5E6D77;--accent:#1D5C7C;--petrolio:#1E6B6F;--ambra:#E8C15A;--ok:#17793F;--ok-bg:#E4F2EA;--warn:#A5660A;--warn-bg:#FAF0DE;--ko:#AE2F28;--ko-bg:#F8E3E1;--f-a:#4a6a8a;--f-b:#5b7f6e;--f-c:#8a7a4e;--f-d:#56616d;--f-e:#3d6b74;--sup:#fff;--riga:#E6EBEE;--campo:#fff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--pagina:#0F1D26;--notte:#0A1720;--bordo:#2A4352;--ink:#E6EEF2;--ink3:#A9BAC5;--accent:#7FB6D6;--petrolio:#2B8589;--ok:#5CC58A;--ok-bg:#163527;--warn:#E8B15A;--warn-bg:#3A2D14;--ko:#F08A84;--ko-bg:#3A1F1E;--sup:#162A36;--riga:#22394A;--campo:#10222D;color-scheme:dark}}
:root[data-theme="dark"]{--pagina:#0F1D26;--notte:#0A1720;--bordo:#2A4352;--ink:#E6EEF2;--ink3:#A9BAC5;--accent:#7FB6D6;--petrolio:#2B8589;--ok:#5CC58A;--ok-bg:#163527;--warn:#E8B15A;--warn-bg:#3A2D14;--ko:#F08A84;--ko-bg:#3A1F1E;--sup:#162A36;--riga:#22394A;--campo:#10222D;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--pagina);color:var(--ink);font:500 16px/1.45 Barlow,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
header{background:var(--notte);color:#fff;display:flex;align-items:center;gap:12px;padding:10px max(16px,env(safe-area-inset-left,0px))}
header .lg{width:32px;height:32px;flex:none}
header b{font:700 19px/1 "Barlow Semi Condensed",sans-serif}header small{display:block;color:#9FB2BF;font-size:12.5px;font-weight:500}
header .dx{margin-left:auto;display:flex;gap:8px}header .dx a,header .dx button{all:unset;cursor:pointer;color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:8px;padding:6px 12px;font-size:14px;font-weight:600}
.w{max-width:980px;margin:0 auto;padding:0 16px 40px}
.nav{display:flex;align-items:center;gap:10px;padding:12px 0;flex-wrap:wrap}
.back{all:unset;cursor:pointer;background:var(--sup);border:1px solid var(--bordo);border-radius:8px;padding:7px 12px;font-weight:600;font-size:14.5px}
.crumb{font-size:14px;color:var(--ink3)}.crumb a{color:var(--accent);cursor:pointer;text-decoration:underline}.crumb b{color:var(--ink)}
h2.t{font:700 26px/1.1 "Barlow Semi Condensed",sans-serif;margin:6px 0 12px}
h3.sez{margin:16px 0 8px;font-size:14px;letter-spacing:.05em;color:var(--ink3)}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{all:unset;box-sizing:border-box;cursor:pointer;background:var(--sup);border:1px solid var(--bordo);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px}
.tile:hover{border-color:var(--accent)}.tile .q{width:38px;height:38px;border-radius:9px;display:grid;place-items:center}.tile .q svg{width:21px;height:21px;stroke:#fff;fill:none;stroke-width:1.9}
.tile b{font:700 19px/1.15 "Barlow Semi Condensed",sans-serif}.tile small{color:var(--ink3);font-size:14px}.tile small.w{color:var(--warn);font-weight:700}
.card{background:var(--sup);border:1px solid var(--bordo);border-radius:12px;padding:14px 16px;margin-top:12px}
.card h3{margin:0 0 8px;font-size:14px;letter-spacing:.05em;color:var(--ink3)}
.num{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.num div{background:var(--sup);border:1px solid var(--bordo);border-radius:12px;padding:12px 14px}.num b{display:block;font:700 30px/1.1 "Barlow Semi Condensed",sans-serif;font-variant-numeric:tabular-nums}.num span{color:var(--ink3);font-size:14px}
.tab{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:15px}th{text-align:left;font-size:13px;color:var(--ink3);padding:7px 8px;border-bottom:2px solid var(--bordo)}td{padding:9px 8px;border-bottom:1px solid var(--riga);vertical-align:top}
td.e{color:var(--ink3);white-space:nowrap}
.riga{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:12px;width:100%;padding:11px 4px;border-top:1px solid var(--riga)}.riga:first-child{border-top:0}
.riga .n{width:30px;height:30px;border-radius:8px;background:var(--petrolio);color:#fff;font-weight:700;display:grid;place-items:center;flex:none}
.riga .m{flex:1;min-width:0}.riga .m b{display:block}.riga .m small{color:var(--ink3)}.chev{color:var(--ink3)}
.lg{border-top:1px solid var(--riga);padding:12px 0}.lg:first-child{border-top:0;padding-top:2px}.lg.ris{opacity:.55}.lg-h{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.lg-q{margin-left:auto!important}.lg-m{display:block;margin:6px 0 2px;font-size:16px;overflow-wrap:anywhere}.lg details{margin-top:6px}.lg summary{cursor:pointer;color:var(--accent,#1D5C7C);font-weight:700;font-size:14.5px}.lg pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12.5px;background:#F5F7F8;border-radius:8px;padding:8px;margin:6px 0 0;max-height:260px;overflow:auto}
.pill{font-size:12.5px;font-weight:700;border-radius:20px;padding:2px 9px;white-space:nowrap}.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.w{background:var(--warn-bg);color:var(--warn)}.pill.ko{background:var(--ko-bg);color:var(--ko)}
.btn{all:unset;box-sizing:border-box;cursor:pointer;background:var(--petrolio);color:#fff;font-weight:700;border-radius:9px;padding:10px 15px;font-size:15px;display:inline-flex;align-items:center;gap:8px}.btn.sec{background:var(--sup);color:var(--petrolio);border:1.5px solid var(--petrolio)}.btn.ko{background:var(--sup);color:var(--ko);border:1.5px solid var(--ko)}
.btn[disabled]{opacity:.6;pointer-events:none}
.btn:focus-visible,.tile:focus-visible,.riga:focus-visible,.back:focus-visible{outline:3px solid var(--ambra);outline-offset:2px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.sc{border:1px solid var(--bordo);border-radius:12px;margin-top:10px;background:var(--sup);overflow:hidden}
.sc>summary{list-style:none;cursor:pointer;display:flex;gap:12px;align-items:center;padding:10px 12px}.sc>summary::-webkit-details-marker{display:none}
.sc .mini{width:128px;aspect-ratio:16/9;border-radius:6px;background:#0F2230;color:#fff;padding:8px;flex:none;display:flex;flex-direction:column;justify-content:center;gap:2px;overflow:hidden}
.sc .mini i{font-style:normal;font-size:7px;letter-spacing:.1em;color:var(--ambra);font-weight:700}.sc .mini em{font-style:normal;font:700 13px/1 "Barlow Semi Condensed",sans-serif}.sc .mini u{text-decoration:none;font-size:7px;color:#C9D6DE}
.sc .ed{padding:4px 14px 14px;display:grid;gap:8px}
label{font-weight:700;font-size:13.5px}input[type=text],textarea,select{width:100%;border:1.5px solid var(--bordo);border-radius:8px;padding:9px 11px;font:inherit;font-size:15px;background:var(--campo);color:var(--ink)}textarea{min-height:80px;resize:vertical}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stato{display:flex;align-items:center;gap:10px;background:var(--warn-bg);color:var(--warn);font-weight:700;border-radius:10px;padding:10px 12px;margin-top:12px}
.stato.ok{background:var(--ok-bg);color:var(--ok)}.stato.ko{background:var(--ko-bg);color:var(--ko)}
.spin{width:16px;height:16px;border:2.5px solid rgba(165,102,10,.3);border-top-color:var(--warn);border-radius:50%;animation:g .8s linear infinite;flex:none}@keyframes g{to{transform:rotate(360deg)}}
.vid{width:100%;aspect-ratio:16/9;border-radius:10px;background:#0F2230;color:#C9D6DE;display:grid;place-items:center;font-size:14px}
video.vid{display:block}
.fine{color:var(--ink3);font-size:14.5px;margin:0}
.dom{border:1px solid var(--bordo);border-radius:10px;padding:12px;display:grid;gap:8px;margin-top:10px}
[hidden]{display:none!important}
/* lettore audio */
.au{background:var(--notte);color:#fff;border-radius:14px;padding:16px;margin-top:18px;display:grid;gap:12px}
.au .ti{display:flex;gap:12px;align-items:center}.au .ic{width:40px;height:40px;border-radius:10px;background:var(--petrolio);display:grid;place-items:center;flex:none}
.au .ti b{display:block;font:700 20px/1.15 var(--disp)}.au .ti small{color:#C9D6DE;font-size:14px}
.au .ora{background:rgba(255,255,255,.07);border-radius:10px;padding:10px 12px}.au .ora small{color:var(--ambra);font-weight:700;font-size:13px;letter-spacing:.05em}.au .ora b{display:block;font:700 19px/1.2 var(--disp)}
.au .bar{height:6px;background:rgba(255,255,255,.18);border-radius:3px;overflow:hidden;margin-top:8px}.au .bar i{display:block;height:100%;background:var(--ambra);width:0}
.au .tm{display:flex;justify-content:space-between;font-size:13px;color:#C9D6DE;margin-top:4px;font-variant-numeric:tabular-nums}
.au .cmd{display:flex;justify-content:center;align-items:center;gap:10px}
.au .cmd button{all:unset;cursor:pointer;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;border:1.5px solid rgba(255,255,255,.3)}
.au .cmd button.play{width:64px;height:64px;background:var(--ambra);border:0}.au .cmd button svg{width:22px;height:22px}
.au .cmd button:focus-visible,.au .vel button:focus-visible{outline:3px solid var(--ambra);outline-offset:2px}
.au .vel{display:flex;gap:6px;justify-content:center}.au .vel button{all:unset;cursor:pointer;font-size:14px;font-weight:700;padding:5px 11px;border-radius:7px;border:1px solid rgba(255,255,255,.25);color:#C9D6DE}.au .vel button.on{background:#fff;color:var(--notte)}
.au .capi{display:grid;gap:2px}.au .capi button{all:unset;cursor:pointer;display:flex;gap:10px;align-items:center;padding:7px 8px;border-radius:8px;font-size:15px;color:#C9D6DE}
.au .capi button.on{background:rgba(232,193,90,.15);color:#fff;font-weight:700}.au .capi button span{width:24px;height:24px;border-radius:6px;background:rgba(255,255,255,.1);display:grid;place-items:center;font-size:13px;flex:none}.au .capi button.on span{background:var(--ambra);color:var(--notte)}
.au .capi em{font-style:normal;margin-left:auto;font-size:13px;opacity:.75}
.au .info{font-size:13.5px;color:#C9D6DE;border-top:1px solid rgba(255,255,255,.12);padding-top:10px}
.au details.cap{color:#C9D6DE;font-size:15px}.au details.cap summary{cursor:pointer;font-weight:700;color:#fff}
.au{max-width:640px;--disp:"Barlow Semi Condensed","Arial Narrow",Arial,sans-serif}.au .cmd button:disabled{opacity:.4}
.selc{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 0}.selc button{all:unset;cursor:pointer;border:1.5px solid var(--bordo);background:var(--sup);border-radius:8px;padding:7px 12px;font-weight:700;font-size:14.5px}.selc button.on{border-color:var(--petrolio);color:var(--petrolio)}
a{color:var(--accent)}
@media(max-width:640px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.g2{grid-template-columns:1fr}.sc .mini{width:96px}td.e{white-space:normal}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
</style></head><body>
<header><svg class="lg" viewBox="0 0 120 120" aria-hidden="true"><rect width="120" height="120" rx="26" fill="#1E6B6F"/><rect x="18" y="24" width="84" height="7" rx="3.5" fill="#E8C15A"/><g transform="translate(60 72)" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round"><path d="M-22-14l44 28M22-14l-44 28"/><circle cx="-24" cy="-16" r="9"/><circle cx="24" cy="-16" r="9"/><circle cx="-24" cy="16" r="9"/><circle cx="24" cy="16" r="9"/></g></svg>
<span><b>Quota 120</b><small>Pannello Admin del sito</small></span>
<span class="dx"><a href="https://app.quota120.com/" target="_blank" rel="noopener">Programma</a><button id="esci" type="button">Esci</button></span></header>
<div class="w">
<div class="nav"><button class="back" id="back" type="button" hidden>← Indietro</button><span class="crumb" id="crumb"></span></div>
<div id="v"><p class="fine">Carico…</p></div>
</div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const data=t=>t?new Date(t).toLocaleDateString('it-IT'):'–';
function quando(t){if(!t)return 'mai';const g=Math.floor((new Date().setHours(0,0,0,0)-new Date(t).setHours(0,0,0,0))/864e5);return g<=0?'oggi':g===1?'ieri':g+' giorni fa'}
const giorni=t=>t?(Date.now()-t)/864e5:1e9;
const I={drone:'<circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M8 8l8 8M16 8l-8 8"/>',stato:'<path d="M3 12h4l3-7 4 14 3-7h4"/>',users:'<path d="M4 20c0-3 3-5 6-5s6 2 6 5"/><circle cx="10" cy="8" r="3.5"/><path d="M16 4.5a3 3 0 0 1 0 6M18 15c2 .6 3 2 3 4"/>',play:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M10 9l5 3-5 3z"/>',plus:'<path d="M12 5v14M5 12h14"/>',cuffie:'<path d="M4 14v-2a8 8 0 0 1 16 0v2"/><rect x="3" y="14" width="4" height="7" rx="1.5"/><rect x="17" y="14" width="4" height="7" rx="1.5"/>',web:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/>'};
const ic=(k,c)=>`<span class="q" style="background:var(${c})"><svg viewBox="0 0 24 24">${I[k]}</svg></span>`;

let P=null,ISC=null,CORSI=null;
async function api(u,x){const r=await fetch(u,x?{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(x)}:{cache:'no-store'});
  if(r.status===401){location.replace('/admin/');throw new Error('Entra di nuovo')}
  const j=await r.json().catch(()=>({}));if(!r.ok||j.errore)throw new Error(j.errore||'Qualcosa non è andato: riprova.');return j}
async function caricaP(){P=await api('/api/admin/panoramica')}
async function caricaI(){ISC=(await api('/api/admin/iscritti')).iscritti.sort((a,b)=>b.dal-a.dal)}
async function caricaC(){CORSI=await api('/api/admin/corsi')}
async function salvaC(){await api('/api/admin/corsi',CORSI)}

/* navigazione: una pila di schermate, come nel programma */
let PILA=[];
function vai(f,c,a){PILA.push([f,c,a]);mostra()}
function indietro(){PILA.pop();mostra()}
function mostra(){const [f,,a]=PILA[PILA.length-1];if(f!==auto&&!AU.paused)AU.pause();$('#back').hidden=PILA.length<2;
  $('#crumb').innerHTML=PILA.map((x,i)=>i<PILA.length-1?`<a data-pila="${i+1}">${esc(x[1])}</a>`:`<b>${esc(x[1])}</b>`).join(' › ');
  const v=$('#v');Promise.resolve(f(a)).then(h=>{if(typeof h==='string')v.innerHTML=h;if($('#scene')){scene();qInfo()}if($('#au'))autoPronto();scrollTo(0,0)}).catch(e=>{v.innerHTML=`<div class="stato ko">${esc(e.message)}</div>`})}
$('#back').addEventListener('click',indietro);
$('#crumb').addEventListener('click',e=>{const a=e.target.closest('[data-pila]');if(a){PILA.length=+a.dataset.pila;mostra()}});
$('#esci').addEventListener('click',()=>fetch('/api/admin/esci',{method:'POST'}).finally(()=>location.replace('/admin/')));
/* i bottoni chiamano funzioni per nome: niente codice dentro l'HTML */
const AZ={};
document.addEventListener('click',e=>{const b=e.target.closest('[data-az]');if(!b)return;e.preventDefault();AZ[b.dataset.az](b.dataset.x,b)});

/* ---------- Home ---------- */
async function home(){await caricaP();const o=P.operatori,s=P.stato,nuovi=o.filter(x=>giorni(x.at)<7).length;
  const tutto=s.posta&&s.dji&&s.claude;const lez=P.corsi.reduce((n,c)=>n+c.n,0);
  return `<h2 class="t">Pannello Admin</h2>
  <div class="card" style="margin:0 0 4px;display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span class="pill ${tutto?'ok':'w'}">${tutto?'Tutto funziona':'Da controllare'}</span><span class="fine">${tutto?'programma, email e chiave DJI a posto':'manca qualcosa: vedi Stato del programma'} · ${o.length} ${o.length===1?'operatore iscritto':'operatori iscritti'}${nuovi?' · '+nuovi+' nuovo questa settimana':''}</span></div>
  <h3 class="sez">IL PROGRAMMA</h3><div class="tiles">
  <button class="tile" data-az="operatori">${ic('drone','--f-a')}<b>Operatori iscritti</b><small${nuovi?' class="w"':''}>${o.length} ${o.length===1?'operatore':'operatori'}${nuovi?' · '+nuovi+' nuovo':''}</small></button>
  <button class="tile" data-az="stato">${ic('stato','--f-b')}<b>Stato del programma</b><small>${tutto?'tutto funziona':'da controllare'}</small></button>
  <button class="tile" data-az="problemi">${ic('stato',P.problemi?'--f-c':'--f-b')}<b>Problemi dell’app</b><small${P.problemi?' class="w"':''}>${P.problemi?P.problemi+' da guardare':'nessuno da guardare'}</small></button>
  <a class="tile" href="https://app.quota120.com/" target="_blank" rel="noopener">${ic('web','--f-d')}<b>Apri il programma</b><small>app.quota120.com</small></a></div>
  <h3 class="sez">IL SITO E I CORSI</h3><div class="tiles">
  <button class="tile" data-az="iscritti">${ic('users','--f-b')}<b>Iscritti al corso</b><small>${P.iscritti.n||0} iscritti · ${P.iscritti.nn||0} vogliono le novità</small></button>
  <button class="tile" data-az="corsi">${ic('play','--f-a')}<b>Videocorsi</b><small>${P.corsi.length} ${P.corsi.length===1?'corso':'corsi'} · ${lez} lezioni</small></button>
  <button class="tile" data-az="auto">${ic('cuffie','--f-e')}<b>Ascolta in auto</b><small>solo voce · a schermo spento</small></button>
  <button class="tile" data-az="nuovo">${ic('plus','--f-c')}<b>Nuovo videocorso</b><small>titolo, lezioni, video</small></button>
  <a class="tile" href="/" target="_blank">${ic('web','--f-d')}<b>Vedi il sito</b><small>quota120.com</small></a></div>`}
/* ---------- Problemi dell'app: errori registrati da soli e messaggi «Qualcosa non funziona?» ---------- */
let LOG=[],LOGF='';
const oraL=t=>{const d=new Date(t);return quando(t)+' '+d.toTimeString().slice(0,5)};
const tel=ua=>{ua=ua||'';const o=/iPhone/.test(ua)?'iPhone':/iPad/.test(ua)?'iPad':/Android/.test(ua)?'Android':/Mac/.test(ua)?'Mac':/Windows/.test(ua)?'PC Windows':/Linux/.test(ua)?'Linux':'altro';
  const b=/Edg\//.test(ua)?'Edge':/CriOS|Chrome\//.test(ua)?'Chrome':/FxiOS|Firefox\//.test(ua)?'Firefox':/Safari\//.test(ua)?'Safari':'';return o+(b?' · '+b:'')};
function testoLog(x){return [(x.tipo==='mess'?'MESSAGGIO':'ERRORE')+' · '+new Date(x.at).toLocaleString('it-IT')+(x.n>1?' · '+x.n+' volte (ultima '+new Date(x.ult).toLocaleString('it-IT')+')':''),
  'Spazio: '+(x.opn||x.op)+' ('+x.op+') · '+(x.chi||'?')+', '+(x.ruolo||''),'Telefono: '+tel(x.ua)+' · schermo '+(x.schermo||'?')+' · rete '+(x.rete||'?'),'Pagina: '+(x.vista||'?'),
  x.testo?'Ha scritto: '+x.testo:'',x.msg?'Errore: '+x.msg:'',x.stack?'Dettagli:\n'+x.stack:'','Ultime cose fatte:\n'+(x.passi||[]).join('\n'),'User agent: '+(x.ua||'')].filter(Boolean).join('\n')}
async function problemi(){LOG=await api('/api/admin/log');if(!Array.isArray(LOG))LOG=[];
  const da=LOG.filter(x=>!x.risolto),err7=LOG.filter(x=>x.tipo==='err'&&giorni(x.ult)<7).reduce((n,x)=>n+(x.n||1),0),mes=LOG.filter(x=>x.tipo==='mess'&&!x.risolto).length;
  const L=LOG.filter(x=>LOGF==='mess'?x.tipo==='mess'&&!x.risolto:LOGF==='err'?x.tipo==='err'&&!x.risolto:LOGF==='risolto'?x.risolto:true);
  const f=(k,t)=>`<button type="button" class="${LOGF===k?'on':''}" data-az="logF" data-x="${k}">${t}</button>`;
  return `<h2 class="t">Problemi dell’app</h2><div class="num"><div><b>${da.length}</b><span>da guardare</span></div><div><b>${err7}</b><span>errori in 7 giorni</span></div><div><b>${mes}</b><span>${mes===1?'messaggio':'messaggi'}</span></div></div>
  <div class="selc" style="margin:12px 0 8px">${f('','Tutti')}${f('mess','Messaggi')}${f('err','Errori')}${f('risolto','Risolti')}</div>

function autoPronto(){const c=CORSI.find(x=>x.id===AS.c);AL=c?(c.lezioni||[]).filter(l=>l.audio):[];ACT=c?c.t:'';

  $('#capi').innerHTML=AL.map((l,i)=>`<button type="button" data-c="${i}"><span>${i+1}</span>${esc(l.t)}</button>`).join('');
  ['aprev','aind','aplay','aava','anext'].forEach(k=>$('#'+k).disabled=!AL.length);
  if(AS.i>=AL.length)AS.i=0;
  if(AL.length&&!AU.src.endsWith(AL[AS.i].video+'.m4a'))carica(AS.i,AS.t,false);
  $('#aplay').onclick=()=>AU.paused?suona():AU.pause();

  document.querySelectorAll('.vel button').forEach(b=>b.onclick=()=>{AS.v=+b.dataset.v;AU.playbackRate=AS.v;salvaAS();document.querySelectorAll('.vel button').forEach(x=>x.classList.toggle('on',x===b))});

function carica(i,t,via){const l=AL[i];if(!l)return;AS.i=i;AS.t=t||0;salvaAS();AU.src='/corso/video/'+l.video+'.m4a';
  AU.addEventListener('loadedmetadata',()=>{if(AS.t&&AS.t<AU.duration-1)AU.currentTime=AS.t;AU.playbackRate=AS.v},{once:true});
  if('mediaSession' in navigator)navigator.mediaSession.metadata=new MediaMetadata({title:l.t,artist:ACT,album:'Quota 120',artwork:[{src:'/img/logo-512.png',sizes:'512x512',type:'image/png'}]});
  if(via)suona();aggiorna()}
function salta(i,via){if(i<0||i>=AL.length)return;carica(i,0,via!==undefined?via:!AU.paused)}
function suona(){AU.playbackRate=AS.v;AU.play().catch(()=>{})}
function aggiorna(){if(!$('#au'))return;const l=AL[AS.i];
  $('#ocap').textContent=l?'LEZIONE '+(AS.i+1)+' DI '+AL.length:'';$('#otit').textContent=l?l.t:'';
  $('#opos').textContent=mm(AU.currentTime||0);$('#otot').textContent=mm(AU.duration);$('#obar').style.width=(AU.duration?AU.currentTime/AU.duration*100:0)+'%';
  $('#apic').innerHTML=AU.paused?'<path d="M8 5l11 7-11 7z"/>':'<path d="M7 5h4v14H7zM13 5h4v14h-4z"/>';$('#aplay').setAttribute('aria-label',AU.paused?'Ascolta':'Pausa');
  document.querySelectorAll('#capi button').forEach((b,k)=>b.classList.toggle('on',k===AS.i))}
let ULTS=0;
AU.addEventListener('timeupdate',()=>{if(Date.now()-ULTS>4000){ULTS=Date.now();AS.t=AU.currentTime;salvaAS()}aggiorna()});
['play','pause','loadedmetadata'].forEach(ev=>AU.addEventListener(ev,aggiorna));
AU.addEventListener('ended',()=>{if(AS.i<AL.length-1)carica(AS.i+1,0,true);else{AS.i=0;AS.t=0;salvaAS();aggiorna()}});
if('mediaSession' in navigator){const ms=navigator.mediaSession;
  ms.setActionHandler('play',suona);ms.setActionHandler('pause',()=>AU.pause());
  ms.setActionHandler('previoustrack',()=>salta(AS.i-1,true));ms.setActionHandler('nexttrack',()=>salta(AS.i+1,true));
  try{ms.setActionHandler('seekbackward',()=>{AU.currentTime=Math.max(0,AU.currentTime-15)});ms.setActionHandler('seekforward',()=>{AU.currentTime=Math.min((AU.duration||0)-.5,AU.currentTime+15)})}catch(e){}}

  let lid=(String(c.lezioni.length+1).padStart(2,'0')+'-'+slug(t)).slice(0,50);while(c.lezioni.some(l=>l.id===lid))lid+='-2';
  const l={id:lid,t:t.trim(),s:'',leg:[],h:'',q:[],scene:[{k:'LEZIONE '+(c.lezioni.length+1),t:t.trim(),p:[],v:'Lezione '+(c.lezioni.length+1)+': '+t.trim()+'.'}]};
  c.lezioni.push(l);b.disabled=true;try{await salvaC();await caricaC();vai(lezione,l.t,id+'|'+lid)}catch(e){c.lezioni.pop();alert(e.message);b.disabled=false}};

/* ---------- Lezione: scene del video e domande ---------- */
let LEZ=null;   // copia in modifica
AZ.lezione=x=>{const [cid,lid]=x.split('|'),l=corsoDi(cid).lezioni.find(y=>y.id===lid);vai(lezione,l.t,x)};
function lezione(x){const [cid,lid]=x.split('|'),c=corsoDi(cid),i=c.lezioni.findIndex(y=>y.id===lid),l=c.lezioni[i];
  LEZ={cid,lid,t:l.t,s:l.s||'',scene:JSON.parse(JSON.stringify(l.scene||[])),q:JSON.parse(JSON.stringify(l.q||[]))};
  return `<h2 class="t">Lezione ${i+1} · ${esc(l.t)}</h2>
  ${l.pronto?`<video class="vid" controls preload="metadata" playsinline poster="/corso/video/${esc(l.video)}.jpg" src="/corso/video/${esc(l.video)}.mp4"></video>`:`<div class="vid">${(l.scene||[]).length?'Video in preparazione: pronto pochi minuti dopo il salvataggio':'Ancora nessun video'}</div>`}
  <div class="card g2"><div><label for="lt">Titolo della lezione</label><input type="text" id="lt" value="${esc(l.t)}"></div><div><label for="ls">Sottotitolo</label><input type="text" id="ls" value="${esc(l.s||'')}"></div></div>
  <div class="card"><h3>SCENE DEL VIDEO</h3><p class="fine">Ogni scena è quello che si vede e quello che dice la voce. Cambia i testi, poi «Salva e rifai il video».</p><div id="scene"></div>
  <div class="bar"><button class="btn sec" type="button" data-az="scenaPiu">+ Aggiungi una scena</button></div></div>
  <div class="card"><h3>DOMANDE DELLA LEZIONE</h3><p class="fine" id="qn"></p><div id="dom" hidden></div><div class="bar"><button class="btn sec" type="button" data-az="domande" id="qb">Modifica le domande</button></div></div>
  <div class="bar"><button class="btn" type="button" id="rifai" data-az="rifai">Salva e rifai il video</button><button class="btn ko" type="button" data-az="togliLez">Togli la lezione</button></div><div id="st"></div>`}
function scene(){const box=$('#scene');if(!box)return;box.innerHTML=LEZ.scene.map((s,i)=>`<details class="sc" data-i="${i}"${s._open?' open':''}><summary><span class="mini"><i>${esc(s.k||'')}</i><em>${esc(s.n||s.t||'')}</em><u>${esc((s.p||[])[0]||'')}</u></span><span class="m" style="flex:1;min-width:0"><b>Scena ${i+1}</b><br><small style="color:var(--ink3)">${esc((s.v||'').slice(0,80))}${(s.v||'').length>80?'…':''}</small></span><span class="chev">›</span></summary>
  <div class="ed"><div class="g2"><div><label>Etichetta in alto</label><input type="text" data-f="k" value="${esc(s.k||'')}"></div><div><label>Titolo</label><input type="text" data-f="t" value="${esc(s.t||'')}"></div></div>
  <div class="g2"><div><label>Numero grande (se serve, es. 120 m)</label><input type="text" data-f="n" value="${esc(s.n||'')}"></div><div></div></div>
  <label>Punti sullo schermo (uno per riga)</label><textarea data-f="p">${esc((s.p||[]).join('\n'))}</textarea>
  <label>Tabella (una riga per voce: nome | spiegazione)</label><textarea data-f="l" style="min-height:60px">${esc((s.l||[]).map(r=>r.join(' | ')).join('\n'))}</textarea>
  <label>Cosa dice la voce</label><textarea data-f="v">${esc(s.v||'')}</textarea>
  <div class="bar" style="margin-top:0"><button class="btn sec" type="button" data-az="su" data-x="${i}" aria-label="Sposta su">▲</button><button class="btn sec" type="button" data-az="giu" data-x="${i}" aria-label="Sposta giù">▼</button><button class="btn sec" type="button" data-az="togliScena" data-x="${i}">Togli</button></div></div></details>`).join('')||'<p class="fine">Nessuna scena.</p>'}
function leggiScene(){document.querySelectorAll('#scene details.sc').forEach(d=>{const s=LEZ.scene[+d.dataset.i];s._open=d.open;
  d.querySelectorAll('[data-f]').forEach(e=>{const f=e.dataset.f,v=e.value;
    if(f==='p')s.p=v.split('\n').map(x=>x.trim()).filter(Boolean);
    else if(f==='l')s.l=v.split('\n').map(x=>x.split('|').map(y=>y.trim())).filter(r=>r[0]).map(r=>[r[0],r.slice(1).join(' | ')]);
    else s[f]=v.trim()});
  ['n','p','l','k'].forEach(f=>{if(!s[f]||(Array.isArray(s[f])&&!s[f].length))delete s[f]})})}
AZ.scenaPiu=()=>{leggiScene();LEZ.scene.push({k:'',t:'',v:'',_open:true});scene()};
AZ.su=i=>{leggiScene();i=+i;if(i>0){[LEZ.scene[i-1],LEZ.scene[i]]=[LEZ.scene[i],LEZ.scene[i-1]]}scene()};
AZ.giu=i=>{leggiScene();i=+i;if(i<LEZ.scene.length-1){[LEZ.scene[i+1],LEZ.scene[i]]=[LEZ.scene[i],LEZ.scene[i+1]]}scene()};
AZ.togliScena=i=>{leggiScene();if(confirm('Togliere la scena '+(+i+1)+'?')){LEZ.scene.splice(+i,1);scene()}};
function qInfo(){const e=$('#qn');if(e)e.textContent=LEZ.q.length?LEZ.q.length+(LEZ.q.length===1?' domanda':' domande')+' · usate anche nella simulazione d\'esame':'Nessuna domanda.'}
function domande(){const box=$('#dom');box.innerHTML=LEZ.q.map((q,i)=>`<div class="dom" data-i="${i}"><label>Domanda ${i+1}</label><input type="text" data-f="d" value="${esc(q[0])}">
  <label>Risposte (una per riga)</label><textarea data-f="o" style="min-height:70px">${esc((q[1]||[]).join('\n'))}</textarea>
  <div class="g2"><div><label>Quella giusta è la</label><select data-f="g">${(q[1]||['','','']).map((_,j)=>`<option value="${j}"${j===q[2]?' selected':''}>${j+1}ª risposta</option>`).join('')}</select></div><div></div></div>
  <label>Spiegazione (si vede dopo la risposta)</label><input type="text" data-f="s" value="${esc(q[3]||'')}">
  <div class="bar" style="margin-top:0"><button class="btn sec" type="button" data-az="togliDom" data-x="${i}">Togli la domanda</button></div></div>`).join('')+`<div class="bar"><button class="btn sec" type="button" data-az="domPiu">+ Aggiungi una domanda</button></div>`;qInfo()}
function leggiDom(){document.querySelectorAll('#dom .dom').forEach(d=>{const q=LEZ.q[+d.dataset.i],v=f=>d.querySelector(`[data-f="${f}"]`).value;
  q[0]=v('d').trim();q[1]=v('o').split('\n').map(x=>x.trim()).filter(Boolean);q[2]=Math.min(+v('g')||0,Math.max(0,q[1].length-1));q[3]=v('s').trim()})}
AZ.domande=(x,b)=>{const box=$('#dom');if(box.hidden){box.hidden=false;b.hidden=true;domande()}};
AZ.domPiu=()=>{leggiDom();LEZ.q.push(['',['','',''],0,'']);domande()};
AZ.togliDom=i=>{leggiDom();if(confirm('Togliere la domanda '+(+i+1)+'?')){LEZ.q.splice(+i,1);domande()}};
AZ.rifai=async(x,b)=>{leggiScene();if(!$('#dom').hidden)leggiDom();
  const bad=LEZ.q.findIndex(q=>!q[0]||q[1].length<2);if(bad>=0){alert('La domanda '+(bad+1)+' è incompleta: servono il testo e almeno 2 risposte.');return}
  const c=corsoDi(LEZ.cid),l=c.lezioni.find(y=>y.id===LEZ.lid);
  l.t=$('#lt').value.trim()||l.t;l.s=$('#ls').value.trim();l.scene=LEZ.scene.filter(s=>s.t||s.v||s.n||s.p).map(s=>{const y=Object.assign({},s);delete y._open;return y});l.q=LEZ.q;
  b.disabled=true;b.innerHTML='<span class="spin" style="border-color:rgba(255,255,255,.35);border-top-color:#fff"></span>Salvo…';
  try{const prima=l.video;await salvaC();await caricaC();const n=corsoDi(LEZ.cid).lezioni.find(y=>y.id===LEZ.lid);
    b.disabled=false;b.textContent='Salva e rifai il video';PILA[PILA.length-1][1]=n.t;
    if(n.pronto){$('#st').innerHTML='<div class="stato ok">Salvato. Il video non cambia: le scene sono le stesse.</div>';return}
    $('#st').innerHTML='<div class="stato"><span class="spin"></span>Salvato. Video in preparazione: il controllo automatico passa una volta al giorno (di notte): il video nuovo sarà nel corso entro domani mattina.</div>';
    attendi(LEZ.cid,LEZ.lid)}catch(e){b.disabled=false;b.textContent='Salva e rifai il video';$('#st').innerHTML=`<div class="stato ko">${esc(e.message)}</div>`}};
let ATT=null;
function attendi(cid,lid){clearInterval(ATT);let n=0;ATT=setInterval(async()=>{if(++n>160)return clearInterval(ATT);
  try{await caricaC();const l=corsoDi(cid).lezioni.find(y=>y.id===lid);if(l&&l.pronto){clearInterval(ATT);const st=$('#st');if(st&&LEZ&&LEZ.lid===lid)st.innerHTML='<div class="stato ok">Video pronto: è già nel corso. Riapri la lezione per vederlo.</div>'}}catch(e){}},30000)}
AZ.togliLez=async(x,b)=>{const c=corsoDi(LEZ.cid),l=c.lezioni.find(y=>y.id===LEZ.lid);if(!confirm('Togliere la lezione «'+l.t+'» con il suo video e le sue domande?'))return;
  b.disabled=true;try{c.lezioni=c.lezioni.filter(y=>y.id!==LEZ.lid);await salvaC();PILA.pop();mostra()}catch(e){alert(e.message);b.disabled=false}};

/* ---------- Nuovo corso ---------- */
async function nuovo(){if(!CORSI)await caricaC();
  return `<h2 class="t">Nuovo videocorso</h2><div class="card" style="display:grid;gap:10px"><div><label for="nt">Titolo del corso</label><input type="text" id="nt" placeholder="es. Attestato A2: cosa c'è in più"></div>
  <div><label for="ns">Descrizione breve</label><input type="text" id="ns" placeholder="es. Le materie dell'esame A2, con video e domande"></div>
  <div><label>Chi lo vede</label><div style="display:flex;gap:16px;flex-wrap:wrap;margin-top:4px"><label style="font-weight:500"><input type="radio" name="nv" value="sito" checked> Gli iscritti al sito</label><label style="font-weight:500"><input type="radio" name="nv" value="piloti"> Solo i piloti del programma</label></div></div>
  <div class="bar"><button class="btn" type="button" data-az="crea">Crea il corso</button></div></div>
  <div class="card"><b>Come si fa un video</b><p class="fine" style="margin-top:6px">Per ogni lezione scrivi le scene: quello che si vede e quello che dice la voce. Al «Salva», il video si fa da solo con la voce italiana e finisce nel corso.</p></div>`}
AZ.crea=async(x,b)=>{const t=$('#nt').value.trim();if(!t){$('#nt').focus();return}
  let id=slug(t)||'corso';while(CORSI.some(c=>c.id===id))id+='-2';
  CORSI.push({id,t,s:$('#ns').value.trim(),vis:document.querySelector('input[name=nv]:checked').value,lezioni:[]});
  b.disabled=true;try{await salvaC();await caricaC();PILA.pop();vai(corso,t,id)}catch(e){CORSI.pop();alert(e.message);b.disabled=false}};

vai(home,'Pannello Admin');
</script></body></html>
